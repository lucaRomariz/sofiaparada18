<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://jjctwvkwtofuflktoaxb.supabase.co" />
  <title>Álbum — Sofia 18</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/album.css" />
</head>
<body>
  <div class="noise-overlay" aria-hidden="true"></div>

  <header class="album-header">
    <p class="eyebrow">Sofia 18</p>
    <div class="divider"><span class="divider__mark"></span></div>
    <h1 class="display-title album-header__title">Momentos<br />da Noite</h1>
  </header>

  <div class="album-controls">
    <div class="field album-controls__field">
      <label for="filter-challenge">Desafio</label>
      <select id="filter-challenge">
        <option value="">Todos os desafios</option>
      </select>
    </div>

    <div class="field album-controls__field">
      <label for="sort-order">Ordenar por</label>
      <select id="sort-order">
        <option value="recent">Mais recentes</option>
        <option value="oldest">Mais antigas</option>
        <option value="likes">Mais curtidas</option>
      </select>
    </div>
  </div>

  <main class="album-gallery" id="album-gallery">
    <p class="album-loading" id="album-loading">Carregando álbum...</p>
  </main>

  <p class="album-empty" id="album-empty" hidden>
    Ainda não há fotos no álbum. Seja o primeiro a enviar!
  </p>

  <div class="album-footer">
    <a href="upload.html" class="btn btn--filled">Enviar fotos</a>
    <a href="index.html" class="upload-back-link">← Voltar para a home</a>
  </div>

  <!-- Modal / lightbox -->
  <div class="modal" id="photo-modal" hidden>
    <div class="modal__backdrop" id="modal-backdrop"></div>

    <div class="modal__content">
      <button type="button" class="modal__close" id="modal-close" aria-label="Fechar">×</button>

      <img class="modal__image" id="modal-image" alt="" />

      <div class="modal__meta">
        <p class="modal__name" id="modal-name"></p>
        <p class="modal__date" id="modal-date"></p>
        <p class="modal__challenge" id="modal-challenge" hidden></p>
      </div>

      <button type="button" class="modal__like-btn" id="modal-like-btn" aria-label="Curtir esta foto">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 21s-7.5-4.7-10-9.3C.4 8.3 2 4.5 5.6 4c2-.3 3.8.7 5 2.3C11.8 4.7 13.6 3.7 15.6 4c3.6.5 5.2 4.3 3.6 7.7C20 16.3 12 21 12 21z" />
        </svg>
        <span id="modal-like-count">0</span>
      </button>

      <div class="divider"><span class="divider__mark"></span></div>

      <div class="modal__comments">
        <div class="modal__comments-list" id="modal-comments-list"></div>

        <form class="modal__comment-form" id="modal-comment-form">
          <input
            type="text"
            id="comment-name"
            placeholder="Seu nome"
            autocomplete="name"
            maxlength="60"
            required
          />
          <input
            type="text"
            id="comment-message"
            placeholder="Deixe um comentário"
            maxlength="240"
            required
          />
          <button type="submit" class="btn btn--filled">Comentar</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/album.js"></script>
</body>
</html>
